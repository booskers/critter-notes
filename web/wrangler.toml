# Critter Notes on the web, at notes.crittervtt.com: the same page as the desktop app (www/, made by `node build.mjs`),
# served by Cloudflare from this Worker's static assets. Campaigns stay in each visitor's browser; www/_headers sets the
# security headers and www/sw.js keeps the app for offline use. Deploy: node build.mjs && npx wrangler deploy --config web/wrangler.toml
name = "critter-notes-web"
compatibility_date = "2025-11-01"
workers_dev = false
routes = [{ pattern = "notes.crittervtt.com", custom_domain = true }]

[assets]
directory = "../www"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
